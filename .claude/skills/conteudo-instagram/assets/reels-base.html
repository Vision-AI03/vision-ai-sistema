<!doctype html>
<!--
  Base de cena de Reels 1080x1920 (9:16) para as duas marcas. Copie para .conteudo/<data>-<slug>/cena-NN.html,
  troque data-marca no <body> (vision | cotai), ajuste o logo e reescreva o conteúdo de <main>.
  Mesmos componentes da base de slide (.tag, h1 com <em>, .sub, .lista, .numero, .cta, .phone com .msg/.msg.eu).
  Animação: classe .entra (sobe e aparece) ou .pop (cresce), com o atraso em style="--d:1.2s". O tempo 0 é o início da cena.
  Celular com WhatsApp: copie o modelo comentado no fim do <body>. Mensagens com .chega e --d entram na hora certa;
  .digitando com --d e --ate mostra "digitando…" e some. O celular ocupa a cena quase inteira: nessa cena apague o
  [data-legenda] ou, se tiver título junto, use class="phone menor".
  Legenda da narração: o elemento [data-legenda] recebe o texto da fala automaticamente (apague-o se não quiser legenda).
  Zona segura: o Instagram cobre o topo (~200px), a base (~420px) e a lateral direita — o padding já respeita isso.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#1A1A2E; --bg2:#0F0F1C; --acc1:#7C7DFF; --acc2:#5B5CF6; --txt:#FFFFFF; --muted:#A0A0B0; --line:rgba(91,92,246,.30); }
  body[data-marca="cotai"] { --bg1:#141416; --bg2:#0B0B0C; --acc1:#FFD84D; --acc2:#E0A100; --muted:#A1A1AA; --line:rgba(255,216,77,.28); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body {
    font-family:Inter, system-ui, sans-serif; color:var(--txt);
    background:
      radial-gradient(1000px 800px at 85% -5%, color-mix(in srgb, var(--acc2) 24%, transparent), transparent 70%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    position:relative; padding:200px 110px 420px 80px;
    display:flex; flex-direction:column;
  }
  body::before { /* grid sutil que desliza devagar */
    content:""; position:absolute; inset:-60px 0 0 0; pointer-events:none; opacity:.35;
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:60px 60px; mask-image:linear-gradient(180deg, #000 0%, transparent 45%);
    animation:grid 12s linear both;
  }
  @keyframes grid { to { transform:translateY(60px); } }
  header { display:flex; align-items:center; gap:18px; position:relative; }
  header img { width:64px; height:64px; border-radius:50%; object-fit:cover; }
  body[data-marca="vision"] header img { width:auto; height:64px; border-radius:0; object-fit:contain; }
  header span { font-weight:800; font-size:34px; letter-spacing:-.5px; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; gap:40px; position:relative; }
  .tag { align-self:flex-start; border:1.5px solid var(--line); border-radius:999px; padding:12px 26px;
         font-size:24px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:var(--muted); }
  .tag::before { content:"●"; color:var(--acc1); margin-right:12px; }
  h1 { font-size:104px; line-height:1.0; font-weight:900; letter-spacing:-3px; }
  h1 em { font-style:normal; background:linear-gradient(90deg, var(--acc1), var(--acc2));
          -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-size:40px; line-height:1.35; color:var(--muted); font-weight:500; }
  .sub b { color:var(--txt); font-weight:700; }
  .lista { list-style:none; display:flex; flex-direction:column; gap:24px; }
  .lista li { font-size:38px; line-height:1.3; padding:26px 30px; border-radius:22px;
              background:rgba(255,255,255,.04); border:1px solid var(--line); }
  .lista li b { color:var(--acc1); }
  .numero { font-size:260px; font-weight:900; line-height:.9; letter-spacing:-8px; color:var(--acc1); }
  .cta { align-self:flex-start; font-size:40px; font-weight:800; padding:30px 50px; border-radius:20px;
         background:linear-gradient(90deg, var(--acc1), var(--acc2)); color:#0B0B0C; }
  body[data-marca="vision"] .cta { color:#fff; }
  /* Celular com WhatsApp (modo escuro). Estrutura completa no modelo .phone mais abaixo, comentado.
     As mensagens ficam presas embaixo e as novas empurram as antigas para cima, como no app. */
  .phone { align-self:center; width:600px; height:1160px; flex-shrink:0; border-radius:92px; padding:16px;
           background:linear-gradient(145deg, #3A3A3C, #111113 40%, #2A2A2C); position:relative;
           box-shadow:0 0 0 2px #4A4A4C, 0 40px 100px rgba(0,0,0,.7); }
  .phone .tela { position:relative; height:100%; border-radius:78px; overflow:hidden; background:#0B141A;
                 display:flex; flex-direction:column; font-family:"Helvetica Neue", Inter, sans-serif; }
  .phone .ilha { position:absolute; top:20px; left:50%; transform:translateX(-50%); width:190px; height:56px;
                 border-radius:30px; background:#000; z-index:2; }
  .phone .status { height:96px; padding:30px 52px 0; display:flex; justify-content:space-between; align-items:center;
                   background:#1F2C34; font-size:26px; font-weight:600; }
  .phone .status .icones { display:flex; align-items:center; gap:10px; }
  .phone .sinal { display:flex; align-items:flex-end; gap:3px; height:20px; }
  .phone .sinal i { width:5px; background:#fff; border-radius:2px; }
  .phone .sinal i:nth-child(1) { height:6px; } .phone .sinal i:nth-child(2) { height:10px; }
  .phone .sinal i:nth-child(3) { height:15px; } .phone .sinal i:nth-child(4) { height:20px; }
  .phone .bateria { width:42px; height:21px; border:2px solid rgba(255,255,255,.6); border-radius:6px; padding:2px; position:relative; }
  .phone .bateria::after { content:""; display:block; height:100%; width:80%; background:#fff; border-radius:2px; }
  .phone .topo { background:#1F2C34; padding:10px 26px 20px 14px; display:flex; align-items:center; gap:14px; }
  .phone .topo .voltar { font-size:56px; line-height:1; color:#fff; font-weight:300; margin-top:-8px; }
  .phone .topo .avatar { width:64px; height:64px; border-radius:50%; flex-shrink:0; display:grid; place-items:center;
                         background:linear-gradient(135deg, #25D366, #128C7E); font-size:26px; font-weight:700; }
  .phone .topo img.avatar { object-fit:cover; background:#fff; }
  .phone .topo .nome { flex:1; font-size:29px; font-weight:600; line-height:1.2; }
  .phone .topo small { display:block; font-size:21px; color:#8696A0; font-weight:400; }
  .phone .topo .acoes { display:flex; gap:30px; }
  .phone .topo svg { width:36px; height:36px; fill:none; stroke:#fff; stroke-width:2; }
  .phone .msgs { flex:1; padding:20px 22px 14px; display:flex; flex-direction:column; justify-content:flex-end;
                 gap:10px; overflow:hidden; font-size:28px; line-height:1.35;
                 background-color:#0B141A;
                 background-image:radial-gradient(rgba(255,255,255,.045) 2px, transparent 2.5px),
                                  radial-gradient(rgba(255,255,255,.03) 1.5px, transparent 2px);
                 background-size:34px 34px, 22px 22px; background-position:0 0, 11px 17px; }
  .phone .dia { align-self:center; font-size:20px; color:#8696A0; background:#182229; padding:8px 18px; border-radius:10px; margin-bottom:6px; }
  .msg { max-width:82%; padding:12px 18px 10px; border-radius:16px; background:#202C33; position:relative; }
  .msg:not(.eu) { border-top-left-radius:4px; }
  .msg.eu { align-self:flex-end; background:#005C4B; border-top-right-radius:4px; }
  .msg .hora { display:block; text-align:right; font-size:18px; color:rgba(233,237,239,.6); margin-top:2px; }
  .msg.eu .hora::after { content:"✓✓"; color:#53BDEB; letter-spacing:-5px; margin-left:8px; font-size:18px; }
  .digitando { align-self:flex-start; display:flex; gap:8px; padding:20px 22px; border-radius:16px; border-top-left-radius:4px; background:#202C33; }
  .digitando i { width:12px; height:12px; border-radius:50%; background:#8696A0; animation:pisca 1s infinite; }
  .digitando i:nth-child(2) { animation-delay:.2s; } .digitando i:nth-child(3) { animation-delay:.4s; }
  .phone .barra { display:flex; align-items:center; gap:12px; padding:12px 18px 40px; background:#0B141A; }
  .phone .campo { flex:1; background:#1F2C34; border-radius:40px; padding:18px 26px; font-size:26px; color:#8696A0; }
  .phone .mic { width:72px; height:72px; border-radius:50%; background:#00A884; display:grid; place-items:center; }
  .phone .mic svg { width:34px; height:34px; fill:#fff; }
  /* Mensagem chegando: não ocupa espaço até a hora dela (--d). "Digitando…" some em --ate. */
  .chega { animation:chega .35s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d, 0s); }
  .digitando.chega { animation:chega .25s ease-out var(--d, 0s) both, sai 1ms linear var(--ate, 99s) forwards; }
  @keyframes chega { from { display:none; opacity:0; transform:translateY(24px) scale(.97); } }
  @keyframes sai { to { display:none; } }
  @keyframes pisca { 50% { opacity:.3; } }
  .phone.menor { zoom:.8; }
  /* Legenda da narração (preenchida pelo reels.mjs) */
  [data-legenda] { position:relative; margin-top:30px; text-align:center;
                   font-size:40px; line-height:1.3; font-weight:700; padding:20px 28px; border-radius:18px;
                   background:rgba(0,0,0,.55); animation:entra .4s ease-out both; }
  [data-legenda]:empty { display:none; }
  /* Animações (tempo 0 = início da cena) */
  .entra { animation:entra .6s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d, 0s); }
  .pop   { animation:pop .45s cubic-bezier(.3,1.5,.5,1) both; animation-delay:var(--d, 0s); }
  @keyframes entra { from { opacity:0; transform:translateY(40px); } }
  @keyframes pop   { from { opacity:0; transform:scale(.85); } }
</style>
</head>
<body data-marca="vision">
  <header>
    <img src="../../.claude/skills/conteudo-instagram/assets/logo-vision-transparente.png" alt="">
    <span>Vision AI</span>
  </header>
  <main>
    <div class="tag entra">Atendimento com IA</div>
    <h1 class="entra" style="--d:.3s">Seu cliente mandou mensagem às 23h. <em>Quem respondeu?</em></h1>
    <p class="sub entra" style="--d:.9s">Um agente de IA no WhatsApp <b>responde em segundos</b>.</p>
  </main>
  <div data-legenda></div>

</html>
